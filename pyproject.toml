[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fonttastic"
version = "0.1.0"
description = "Hebrew-first font editor: Illustrator draws the outlines, Font-tastic owns everything typographic."
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fonttools>=4.50",
    "ufoLib2>=0.16",
    "ufo2ft>=3.0",
    "booleanOperations>=0.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "uharfbuzz>=0.40"]
build = ["pyinstaller>=6.16", "pillow>=10"]

[project.scripts]
fonttastic = "fonttastic.__main__:main"

[tool.setuptools.packages.find]
include = ["fonttastic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
